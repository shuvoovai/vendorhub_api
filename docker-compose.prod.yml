services:
  db:
    image: pgvector/pgvector:0.8.0-pg16 # PostgreSQL 16 + pgvector (the visual search migrations need it)
    container_name: vendors-hub-db
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: vendors-hub-api
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads:/app/uploads # uploaded files (media, private documents) survive rebuilds
    # migrations, then the exported seed data (prisma/seed-data, if it was present at build time) on the
    # FIRST start only: --if-empty skips it once the database has users, and it never deletes anything.
    command: sh -c "npx prisma migrate deploy && node prisma/seed-import.js --if-empty && node src/server.js"

volumes:
  pgdata:
  uploads:
